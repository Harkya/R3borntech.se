<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3born Tech — Länkar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090b'/%3E%3Cpath d='M4 16h8l3-9 4 18 3-9h8' stroke='%232dd4bf' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 24px;
}

.links-page {
  max-width: 420px;
  width: 100%;
  text-align: center;
  position: relative;
}

.links-logo {
  height: 34px;
  margin: 0 auto 28px;
  display: block;
}

.links-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--pulse);
  margin: 0 0 10px;
}

.links-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.5rem;
  margin: 0 0 36px;
}

.link-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.link-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  text-decoration: none;
  color: var(--text);
  text-align: left;
  transition: border-color 0.15s ease, transform 0.12s ease;
}

.link-card:hover,
.link-card:focus-visible {
  border-color: var(--pulse);
  transform: translateY(-1px);
}

.link-icon {
  width: 22px;
  height: 22px;
  color: var(--pulse);
  flex-shrink: 0;
}

.link-text { min-width: 0; }

.link-name {
  font-weight: 600;
  font-size: 0.98rem;
  margin: 0 0 2px;
}

.link-sub {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-dim);
  margin: 0;
}

.links-footer {
  margin-top: 40px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-faint);
  letter-spacing: 0.03em;
}
</style>
</head>
<body>

<div class="links-page">
  <img class="links-logo" src="logo.png" alt="R3born Tech">
  <p class="links-eyebrow">Alla kanaler</p>
  <h1 class="links-title">Hitta R3born Tech</h1>

  <div class="link-list">
    <a class="link-card" href="https://www.youtube.com/@R3bornTech" target="_blank" rel="noopener">
      <svg class="link-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="8" width="26" height="16" rx="5"/>
        <path d="M13 12l8 4-8 4z" fill="currentColor" stroke="none"/>
      </svg>
      <div class="link-text">
        <p class="link-name">YouTube</p>
        <p class="link-sub">@R3bornTech — Flipup Challenge</p>
      </div>
    </a>

    <a class="link-card" href="https://www.tiktok.com/@r3borntech" target="_blank" rel="noopener">
      <svg class="link-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 4v16.5a5 5 0 11-4-4.9"/>
        <path d="M18 4c1 3.4 3.4 5.6 7 6"/>
      </svg>
      <div class="link-text">
        <p class="link-name">TikTok</p>
        <p class="link-sub">@r3borntech</p>
      </div>

    <a class="link-card" href="https://www.instagram.com/r3borntech" target="_blank" rel="noopener">
      <svg class="link-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="4" y="4" width="24" height="24" rx="7"/>
        <circle cx="16" cy="16" r="6"/>
        <circle cx="23" cy="9" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
      <div class="link-text">
        <p class="link-name">Instagram</p>
        <p class="link-sub">@r3borntech</p>
      </div>
    </a>

    <a class="link-card" href="https://discord.gg/mMFt8sPgMx" target="_blank" rel="noopener">

        <rect x="4" y="6" width="24" height="16" rx="8"/>
        <path d="M11 22l-3 5v-5"/>

      <svg class="link-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 11h16l-1.5 14a2 2 0 01-2 1.8h-9a2 2 0 01-2-1.8L8 11z"/>
        <path d="M12 11a4 4 0 018 0"/>
        <path d="M9 27c4 2.4 10 2.4 14 0" opacity=".9"/>
      </svg>
      <div class="link-text">
        <p class="link-name">Amazon Storefront</p>
        <p class="link-sub">Utrustningen vi använder</p>
      </div>
    </a>

    <a class="link-card" href="mailto:charlie@r3borntech.se">
      <svg class="link-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="7" width="26" height="18" rx="3"/>
        <path d="M4 9l12 9 12-9"/>
      </svg>
      <div class="link-text">
        <p class="link-name">E-post</p>
        <p class="link-sub">charlie@r3borntech.se</p>
      </div>
    </a>
  </div>

  <p class="links-footer">R3BORN TECH — <span id="year"></span></p>
</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

</html>
